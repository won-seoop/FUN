<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Telescope Console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">✦</span>
    <h1>Space Telescope Console</h1>
  </div>
  <div class="top-status">
    <span id="conn-badge" class="badge off">연결 안 됨</span>
    <span id="job-badge" class="badge idle">대기</span>
    <a class="doclink" href="/docs" target="_blank">API 문서</a>
  </div>
</header>

<main class="grid">
  <!-- 왼쪽: 장비 -->
  <section class="col">
    <div class="card">
      <h2>장비 연결</h2>
      <div class="row">
        <label>모드
          <select id="conn-mode">
            <option value="sim">내장 가상 장비</option>
            <option value="alpaca">ASCOM Alpaca</option>
          </select>
        </label>
      </div>
      <div class="row alpaca-only">
        <label>호스트 <input id="conn-host" value="127.0.0.1"></label>
        <label class="narrow">포트 <input id="conn-port" type="number" value="32323"></label>
      </div>
      <div class="row">
        <button id="btn-connect" class="primary">연결</button>
        <button id="btn-disconnect">연결 해제</button>
      </div>
      <div id="device-info" class="muted small"></div>
    </div>

    <div class="card">
      <h2>망원경</h2>
      <div class="readout">
        <div><span class="lbl">RA</span><span id="pos-ra" class="val">—</span></div>
        <div><span class="lbl">Dec</span><span id="pos-dec" class="val">—</span></div>
        <div><span class="lbl">상태</span><span id="pos-state" class="val">—</span></div>
      </div>
      <canvas id="skymap" width="520" height="260" title="클릭하면 좌표 입력"></canvas>
      <div class="row">
        <label>대상
          <select id="move-target"><option value="">직접 입력</option></select>
        </label>
      </div>
      <div class="row">
        <label>RA (h) <input id="move-ra" type="number" step="0.0001" min="0" max="23.9999" placeholder="0 ~ 24"></label>
        <label>Dec (°) <input id="move-dec" type="number" step="0.0001" min="-90" max="90" placeholder="-90 ~ 90"></label>
      </div>
      <div class="row">
        <button id="btn-move" class="primary">이동</button>
        <button id="btn-stop" class="danger">정지</button>
      </div>
    </div>

    <div class="card">
      <h2>카메라</h2>
      <div class="row">
        <label>노출 (s) <input id="cap-exposure" type="number" step="0.1" min="0.1" value="1"></label>
        <label class="check"><input id="cap-analyze" type="checkbox" checked> 촬영 후 분석</label>
      </div>
      <div class="row"><button id="btn-capture" class="primary">촬영</button></div>
    </div>
  </section>

  <!-- 가운데: 이미지 -->
  <section class="col wide">
    <div class="card">
      <div class="card-head">
        <h2>이미지</h2>
        <div class="row tight">
          <label class="check"><input id="ov-stars" type="checkbox" checked> 별 표시</label>
          <label class="check"><input id="ov-cross" type="checkbox" checked> 중심선</label>
          <button id="btn-analyze" class="small-btn">다시 분석</button>
          <button id="btn-track" class="small-btn">이전 이미지와 이동량</button>
          <a id="btn-fits" class="small-btn" href="#" download>FITS</a>
        </div>
      </div>
      <div class="viewer">
        <canvas id="viewer" width="800" height="600"></canvas>
        <div id="viewer-empty" class="viewer-empty">촬영된 이미지가 없습니다</div>
      </div>
      <div id="analysis" class="analysis"></div>
      <div id="thumbs" class="thumbs"></div>
    </div>
  </section>

  <!-- 오른쪽: 자동화 -->
  <section class="col">
    <div class="card">
      <h2>자동 위치 보정</h2>
      <div class="row">
        <label>대상 <select id="cor-target"></select></label>
      </div>
      <div class="row">
        <label>허용 오차 (") <input id="cor-tol" type="number" value="30" min="1"></label>
        <label>최대 반복 <input id="cor-iter" type="number" value="4" min="1" max="10"></label>
        <label>노출 (s) <input id="cor-exp" type="number" value="1" step="0.1" min="0.1"></label>
      </div>
      <div class="row"><button id="btn-correct" class="primary">보정 실행</button></div>
    </div>

    <div class="card">
      <h2>자동 관측</h2>
      <div id="obs-targets" class="target-list"></div>
      <div class="row">
        <label>보정 노출 (s) <input id="obs-exp" type="number" value="1" step="0.1" min="0.1"></label>
        <label>최종 노출 (s) <input id="obs-final" type="number" value="3" step="0.5" min="0.1"></label>
      </div>
      <div class="row">
        <button id="btn-observe" class="primary">관측 시작</button>
        <button id="btn-cancel" class="danger">취소</button>
      </div>
    </div>

    <div class="card">
      <h2>작업 상태</h2>
      <div class="progress"><div id="job-bar"></div></div>
      <div id="job-info" class="small muted">실행 중인 작업 없음</div>
      <div id="job-results"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>로그</h2><button id="btn-clear-log" class="small-btn">지우기</button></div>
      <div id="log" class="log"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
